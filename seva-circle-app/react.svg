* { box-sizing: border-box; }
html, body, #root { height: 100%; margin: 0; padding: 0; }
body {
  font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
  background: #F7F6F3;
  display: flex;
  justify-content: center;
  padding: 16px;
}
#root { width: 100%; max-width: 480px; height: auto; min-height: 100vh; }
